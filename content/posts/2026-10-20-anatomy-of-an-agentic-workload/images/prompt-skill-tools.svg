<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t     { fill: #1f2937; font-size: 24px; font-weight: 600; }
    .b     { fill: #1f2937; font-size: 16px; }
    .b-s   { fill: #1f2937; font-size: 16px; font-weight: 600; }
    .m     { fill: #6b7280; font-size: 16px; }
    .lab   { fill: #6b7280; font-size: 14px; }
    .mono  { fill: #1f2937; font-size: 15px; font-family: Menlo, Consolas, Liberation Mono, monospace; }
    .w     { fill: #ffffff; font-size: 16px; }
    .w-t   { fill: #ffffff; font-size: 28px; font-weight: 700; }
    .mono-w{ fill: #ffffff; font-size: 15px; font-family: Menlo, Consolas, Liberation Mono, monospace; }
    .line  { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .line-c{ stroke: #0891b2; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.6"/></pattern>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
  </defs>
  <rect width="1600" height="720" fill="#ffffff"/>
  <text x="40" y="58" class="t">Three mechanisms, one run</text>
  <text x="40" y="84" class="m">the prompt defines the responsibility, the skill provides the procedure, the tools retrieve and execute. The model reads the first two and asks for the third.</text>

  <!-- ===== System prompt ===== -->
  <rect x="60" y="120" width="500" height="560" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="80" y="136" width="18" height="18" rx="3" fill="#1d4ed8"/><rect x="80" y="136" width="18" height="18" rx="3" fill="url(#hatch)"/>
  <text x="107" y="152" class="t">System prompt</text>
  <text x="80" y="178" class="m">defines the agent's overall responsibility</text>

  <rect x="80" y="200" width="460" height="118" rx="3" fill="#f5f6f8"/>
  <text x="96" y="226" class="b-s">Responsibility</text>
  <text x="96" y="252" class="b">What the agent is for, and the role it plays</text>
  <text x="96" y="274" class="b">on each request.</text>

  <rect x="80" y="334" width="460" height="118" rx="3" fill="#f5f6f8"/>
  <text x="96" y="360" class="b-s">Limits</text>
  <text x="96" y="386" class="b">What it may touch, which actions need</text>
  <text x="96" y="408" class="b">confirmation, which stay with a person.</text>

  <rect x="80" y="468" width="460" height="118" rx="3" fill="#f5f6f8"/>
  <text x="96" y="494" class="b-s">Stop condition</text>
  <text x="96" y="520" class="b">When the run is done: an answer with</text>
  <text x="96" y="542" class="b">reasons, or the turn limit.</text>

  <text x="80" y="630" class="lab">Text the model reads. Written once,</text>
  <text x="80" y="650" class="lab">in the context of every request.</text>

  <!-- ===== LLM ===== -->
  <rect x="640" y="300" width="280" height="200" rx="4" fill="#0891b2"/>
  <text x="664" y="340" class="w-t">LLM</text>
  <text x="664" y="367" class="w">shared inference endpoint</text>
  <text x="664" y="401" class="mono-w">decode: context → output</text>
  <text x="664" y="435" class="w">Reads everything it is handed.</text>
  <text x="664" y="457" class="w">Returns a tool call or the answer.</text>

  <!-- ===== Skill ===== -->
  <rect x="1040" y="120" width="500" height="250" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="1060" y="136" width="18" height="18" rx="3" fill="#60a5fa"/><rect x="1060" y="136" width="18" height="18" rx="3" fill="url(#hatch)"/>
  <text x="1087" y="152" class="t">Skill</text>
  <text x="1060" y="178" class="m">provides the procedure for a domain or task</text>
  <rect x="1060" y="200" width="460" height="98" rx="3" fill="#f5f6f8"/>
  <text x="1076" y="226" class="mono">gpu-node-drain</text>
  <text x="1076" y="252" class="b">Which checks, in what order, and what</text>
  <text x="1076" y="274" class="b">counts as evidence.</text>
  <text x="1060" y="334" class="lab">Text the model reads. Loaded when the task calls for it.</text>

  <!-- ===== Tools ===== -->
  <rect x="1040" y="410" width="500" height="270" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="1060" y="426" width="18" height="18" rx="3" fill="#fb923c"/>
  <text x="1087" y="442" class="t">Tools</text>
  <text x="1060" y="468" class="m">retrieve information or execute operations</text>
  <rect x="1060" y="490" width="460" height="118" rx="3" fill="#f5f6f8"/>
  <text x="1076" y="518" class="mono">get_pods_on_node</text><text x="1504" y="518" class="lab" text-anchor="end">read state</text>
  <text x="1076" y="549" class="mono">get_cluster_capacity</text><text x="1504" y="549" class="lab" text-anchor="end">do the math</text>
  <text x="1076" y="580" class="mono">cordon_node</text><text x="1504" y="580" class="lab" text-anchor="end">execute</text>
  <text x="1060" y="644" class="lab">Code the harness runs, when the model asks for it.</text>

  <!-- ===== arrows ===== -->
  <path d="M560,400 H638" class="line" marker-end="url(#a-ink)"/>
  <text x="599" y="378" class="lab" text-anchor="middle">into</text>
  <text x="599" y="394" class="lab" text-anchor="middle">context</text>
  <path d="M1040,245 H1010 V360 H922" class="line" marker-end="url(#a-ink)"/>
  <text x="1002" y="300" class="lab" text-anchor="end">into</text>
  <text x="1002" y="316" class="lab" text-anchor="end">context</text>
  <path d="M920,440 H1010 V545 H1038" class="line-c" marker-end="url(#a-cyan)"/>
  <rect x="934" y="484" width="12" height="12" rx="2" fill="#0891b2"/>
  <text x="1002" y="494" class="lab" text-anchor="end">output:</text>
  <text x="1002" y="512" class="lab" text-anchor="end">a tool call</text>
</svg>
