<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t   { fill: #1f2937; font-size: 24px; font-weight: 600; }
    .m   { fill: #6b7280; font-size: 16px; }
    .b   { fill: #1f2937; font-size: 18px; }
    .b16 { fill: #1f2937; font-size: 16px; }
    .msg { fill: #1f2937; font-size: 15px; }
    .who { fill: #6b7280; font-size: 12px; }
    .lab { fill: #6b7280; font-size: 14px; }
    .ln  { stroke: #1f2937; stroke-width: 1.8; fill: none; }
  </style>
  <rect width="1600" height="640" fill="#ffffff"/>

  <text x="40" y="58" class="t">A chatbot trace</text>
  <text x="40" y="84" class="m">the same question, one model call per turn, and a person doing the lookups in between</text>

  <!-- ===== left: chat card ===== -->
  <rect x="40" y="120" width="520" height="442" rx="10" fill="#f5f6f8" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- U1 -->
  <rect x="200" y="140" width="340" height="48" rx="10" fill="#ede9fe"/>
  <text x="220" y="170" class="msg">Should I bike to Amsterdam tomorrow?</text>
  <!-- M1 -->
  <rect x="60" y="200" width="380" height="66" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="80" y="228" class="msg">Depends on the wind and when you need</text>
  <text x="80" y="250" class="msg">to be there. What does your morning look like?</text>
  <!-- U2 -->
  <rect x="200" y="278" width="340" height="66" rx="10" fill="#ede9fe"/>
  <text x="220" y="306" class="msg">09:00 meeting, 20 km. The forecast says</text>
  <text x="220" y="328" class="msg">35 km/h headwind at 07:30.</text>
  <!-- M2 -->
  <rect x="60" y="356" width="380" height="66" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="80" y="384" class="msg">07:30 into that wind is a hard ride.</text>
  <text x="80" y="406" class="msg">Can you leave earlier, or later?</text>
  <!-- U3 -->
  <rect x="200" y="434" width="340" height="48" rx="10" fill="#ede9fe"/>
  <text x="220" y="464" class="msg">Free until 09:00. 06:45 is calm.</text>
  <!-- M3 -->
  <rect x="60" y="494" width="380" height="48" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="80" y="524" class="msg">Leave at 06:45, or take the train.</text>

  <!-- ===== right: the trace ===== -->
  <circle cx="1220" cy="60" r="8" fill="#a78bfa"/><text x="1236" y="65" class="lab">person</text>
  <circle cx="1320" cy="60" r="8" fill="#0891b2"/><text x="1336" y="65" class="lab">model call (GPU)</text>

  <path d="M680,350 H1540" class="ln"/>
  <g>
    <circle cx="700" cy="350" r="11" fill="#a78bfa"/>
    <circle cx="860" cy="350" r="11" fill="#0891b2"/>
    <circle cx="1020" cy="350" r="11" fill="#a78bfa"/>
    <circle cx="1180" cy="350" r="11" fill="#0891b2"/>
    <circle cx="1340" cy="350" r="11" fill="#a78bfa"/>
    <circle cx="1500" cy="350" r="11" fill="#0891b2"/>
  </g>
  <g class="b16" text-anchor="middle">
    <text x="700" y="388">User</text>
    <text x="860" y="388">Model</text>
    <text x="1020" y="388">User</text>
    <text x="1180" y="388">Model</text>
    <text x="1340" y="388">User</text>
    <text x="1500" y="388">Model</text>
  </g>

  <!-- segment bars -->
  <path d="M712,300 H848" stroke="#0891b2" stroke-width="3"/>
  <text x="780" y="284" class="lab" text-anchor="middle">one model call</text>
  <path d="M872,300 H1008" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="940" y="284" class="lab" text-anchor="middle">person reads, looks up, types</text>
  <path d="M1032,300 H1168" stroke="#0891b2" stroke-width="3"/>
  <path d="M1192,300 H1328" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M1352,300 H1488" stroke="#0891b2" stroke-width="3"/>

  <!-- what happened at each node -->
  <text x="860" y="424" class="lab" text-anchor="middle">no tools:</text>
  <text x="860" y="442" class="lab" text-anchor="middle">asks the person</text>
  <text x="1020" y="424" class="lab" text-anchor="middle">looks up calendar</text>
  <text x="1020" y="442" class="lab" text-anchor="middle">and forecast by hand</text>
  <text x="1180" y="424" class="lab" text-anchor="middle">asks again</text>
  <text x="1340" y="424" class="lab" text-anchor="middle">checks the</text>
  <text x="1340" y="442" class="lab" text-anchor="middle">06:45 forecast</text>
  <text x="1500" y="424" class="lab" text-anchor="middle">recommends</text>

  <text x="1110" y="540" class="lab" text-anchor="middle">3 model calls, 0 tool calls: the person did every lookup, at the person's pace</text>
</svg>
