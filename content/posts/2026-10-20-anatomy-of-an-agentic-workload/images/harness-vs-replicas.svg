<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" width="1600" height="430" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{fill:#1f2937;font-size:24px;font-weight:600}.m{fill:#6b7280;font-size:16px}
    .b{fill:#1f2937;font-size:18px;font-weight:600}.b16{fill:#1f2937;font-size:16px}.lab{fill:#6b7280;font-size:14px}.lab-i{fill:#1f2937;font-size:14px}
    .plus{fill:#6b7280;font-size:28px}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect width="1600" height="430" fill="#ffffff"/>
  <text x="40" y="58" class="t">Harness workers and inference replicas scale independently</text>
  <text x="40" y="84" class="m">adding workers starts more runs; only adding replicas answers more requests</text>

  <!-- legend -->
  <circle cx="1000" cy="60" r="7" fill="#0891b2"/><text x="1014" y="65" class="lab">run waiting on the model</text>
  <circle cx="1205" cy="60" r="7" fill="#fb923c"/><text x="1219" y="65" class="lab">run inside a tool</text>
  <rect x="1350" y="53" width="13" height="13" rx="2" fill="#0891b2"/><text x="1370" y="65" class="lab">request in flight on the replica</text>

  <!-- harness row -->
  <text x="40" y="150" class="b">Harness workers</text>
  <text x="40" y="172" class="lab">CPU, memory, network. No GPU.</text>
  <g>
    <rect x="320" y="120" width="150" height="80" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="395" y="142" class="lab" text-anchor="middle">worker 1</text>
    <circle cx="362" cy="172" r="7" fill="#0891b2"/><circle cx="384" cy="172" r="7" fill="#fb923c"/><circle cx="406" cy="172" r="7" fill="#fb923c"/><circle cx="428" cy="172" r="7" fill="#0891b2"/>
    <rect x="490" y="120" width="150" height="80" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="565" y="142" class="lab" text-anchor="middle">worker 2</text>
    <circle cx="532" cy="172" r="7" fill="#fb923c"/><circle cx="554" cy="172" r="7" fill="#0891b2"/><circle cx="576" cy="172" r="7" fill="#fb923c"/><circle cx="598" cy="172" r="7" fill="#0891b2"/>
    <rect x="660" y="120" width="150" height="80" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="735" y="142" class="lab" text-anchor="middle">worker 3</text>
    <circle cx="702" cy="172" r="7" fill="#0891b2"/><circle cx="724" cy="172" r="7" fill="#fb923c"/><circle cx="746" cy="172" r="7" fill="#0891b2"/><circle cx="768" cy="172" r="7" fill="#fb923c"/>
    <rect x="830" y="120" width="150" height="80" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/><text x="905" y="170" class="plus" text-anchor="middle">+</text>
  </g>
  <text x="1010" y="150" class="b16">more runs in flight</text>
  <text x="1010" y="172" class="lab">each one making its own model calls</text>

  <!-- requests arrow -->
  <path d="M565,200 V300" stroke="#1f2937" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="580" y="254" class="lab">requests: context in, output back. This is where the GPU work starts.</text>

  <!-- replica row -->
  <text x="40" y="340" class="b">Inference replica</text>
  <text x="40" y="362" class="lab">GPU, model weights, KV cache.</text>
  <g>
    <rect x="320" y="300" width="320" height="90" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <text x="336" y="324" class="lab-i">replica 1</text>
    <text x="420" y="324" class="lab">6 of 8 requests in flight</text>
    <rect x="336" y="344" width="22" height="22" rx="3" fill="#0891b2"/>
    <rect x="368" y="344" width="22" height="22" rx="3" fill="#0891b2"/>
    <rect x="400" y="344" width="22" height="22" rx="3" fill="#0891b2"/>
    <rect x="432" y="344" width="22" height="22" rx="3" fill="#0891b2"/>
    <rect x="464" y="344" width="22" height="22" rx="3" fill="#0891b2"/>
    <rect x="496" y="344" width="22" height="22" rx="3" fill="#0891b2"/>
    <rect x="528" y="344" width="22" height="22" rx="3" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="560" y="344" width="22" height="22" rx="3" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="660" y="300" width="150" height="90" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/><text x="735" y="355" class="plus" text-anchor="middle">+</text>
  </g>
  <text x="1010" y="340" class="b16">more requests answered at once</text>
  <text x="1010" y="362" class="lab">the only lever that moves the loop faster</text>

</svg>
