<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t  { fill: #1f2937; font-size: 24px; font-weight: 600; }
    .m  { fill: #6b7280; font-size: 16px; }
    .b  { fill: #1f2937; font-size: 17px; }
    .lab{ fill: #6b7280; font-size: 14px; }
    .ln { stroke: #1f2937; stroke-width: 1.8; fill: none; }
    .ghost { stroke: #c4c9d1; stroke-width: 1.8; fill: none; }
  </style>
  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="40" y="58" class="t">An agent request</text>
  <text x="40" y="84" class="m">one trigger, many model calls, and gaps between them where the GPU does nothing for this run</text>

  <!-- ghost runs (drawn first) -->
  <path d="M300,500 C360,500 380,640 460,640 H640 C700,640 720,720 800,720 C880,720 900,640 960,640 H1120 C1180,640 1200,700 1280,700" class="ghost"/>
  <path d="M640,640 C700,640 720,600 800,600 C880,600 900,640 960,640" class="ghost"/>
  <path d="M300,500 C380,500 400,790 500,790 H760 C820,790 840,760 900,760 H1120 C1180,760 1200,820 1300,820" class="ghost"/>
  <path d="M300,500 C400,500 420,900 520,900 H700 C760,900 780,860 860,860 C940,860 960,900 1020,900 H1200" class="ghost"/>
  <g fill="#ffffff" stroke="#c4c9d1" stroke-width="1.8">
    <circle cx="460" cy="640" r="6"/><circle cx="640" cy="640" r="6"/><circle cx="800" cy="720" r="6"/><circle cx="800" cy="600" r="6"/><circle cx="960" cy="640" r="6"/><circle cx="1120" cy="640" r="6"/><circle cx="1280" cy="700" r="6"/>
    <circle cx="500" cy="790" r="6"/><circle cx="760" cy="790" r="6"/><circle cx="900" cy="760" r="6"/><circle cx="1120" cy="760" r="6"/><circle cx="1300" cy="820" r="6"/>
    <circle cx="520" cy="900" r="6"/><circle cx="700" cy="900" r="6"/><circle cx="860" cy="860" r="6"/><circle cx="1020" cy="900" r="6"/><circle cx="1200" cy="900" r="6"/>
  </g>
  <text x="800" y="955" class="lab" text-anchor="middle">Other executions of the same request, separate runs: a different path and a different number of model calls each time</text>

  <!-- main run -->
  <path d="M60,500 H300" class="ln"/>
  <path d="M300,500 C400,500 420,300 520,300" class="ln"/>
  <path d="M520,300 H740" class="ln"/>
  <path d="M740,300 C820,300 840,420 920,420" class="ln"/>
  <path d="M920,420 C1000,420 1020,300 1100,300" class="ln"/>
  <path d="M1100,300 C1180,300 1200,200 1280,200 H1480" class="ln"/>
  <path d="M1100,300 H1280 H1480" class="ln"/>
  <path d="M1100,300 C1160,300 1170,400 1200,400 H1480" class="ln"/>

  <!-- nodes -->
  <circle cx="60" cy="500" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="300" cy="500" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="520" cy="300" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="740" cy="300" r="10" fill="#fb923c"/>
  <circle cx="920" cy="420" r="11" fill="#0891b2"/>
  <circle cx="1100" cy="300" r="11" fill="#0891b2"/>
  <circle cx="1280" cy="200" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="1280" cy="300" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="1200" cy="400" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="1290" cy="400" r="11" fill="#0891b2"/>
  <circle cx="1380" cy="400" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="1480" cy="200" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="3 2"/>
  <circle cx="1480" cy="300" r="10" fill="#fb923c"/>
  <circle cx="1480" cy="400" r="10" fill="#fb923c"/>

  <!-- labels -->
  <text x="60" y="470" class="b">Agent request</text>
  <text x="60" y="532" class="lab">a person, a schedule, an event, a workflow step</text>
  <text x="520" y="270" class="b" text-anchor="middle">Tool call</text>
  <text x="740" y="270" class="b" text-anchor="middle">Tool result</text>
  <text x="920" y="460" class="b" text-anchor="middle">Model call</text>
  <text x="920" y="480" class="lab" text-anchor="middle">GPU busy</text>
  <text x="1100" y="270" class="b" text-anchor="middle">Dispatch</text>
  <text x="1080" y="232" class="lab" text-anchor="middle">one model call: two tool calls</text>
  <text x="1080" y="250" class="lab" text-anchor="middle">and a subagent, all at once</text>
  <text x="1280" y="172" class="b" text-anchor="middle">Tool call</text>
  <text x="1280" y="340" class="b" text-anchor="middle">Tool call</text>
  <text x="1200" y="440" class="lab" text-anchor="middle">delegate</text>
  <text x="1290" y="440" class="lab" text-anchor="middle">model call</text>
  <text x="1380" y="440" class="lab" text-anchor="middle">tool call</text>
  <text x="1340" y="470" class="b" text-anchor="middle">Subagent: its own loop, its own requests</text>
  <text x="1480" y="172" class="b" text-anchor="middle">Stopped</text>
  <text x="1480" y="340" class="b" text-anchor="middle">Result</text>
  <text x="1480" y="440" class="b" text-anchor="middle">Result</text>

  <!-- gap annotation -->
  <path d="M532,330 H728" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <text x="630" y="352" class="lab" text-anchor="middle">tool runs; GPU idle for this run</text>
  <text x="630" y="370" class="lab" text-anchor="middle">5.2 s median, 81 s P99 (Codex traces)</text>

  <!-- legend -->
  <g>
    <circle cx="1120" cy="80" r="8" fill="#0891b2"/><text x="1136" y="85" class="lab">model call (GPU)</text>
    <circle cx="1290" cy="80" r="8" fill="#fb923c"/><text x="1306" y="85" class="lab">tool result</text>
    <circle cx="1420" cy="80" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/><text x="1436" y="85" class="lab">harness or tool, no GPU</text>
  </g>
</svg>
