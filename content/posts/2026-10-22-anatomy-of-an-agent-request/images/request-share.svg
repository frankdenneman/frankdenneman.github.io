<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.t{fill:#1f2937;font-size:24px;font-weight:600}.m{fill:#6b7280;font-size:16px}.b{fill:#1f2937;font-size:16px;font-weight:600}
  .lab{fill:#6b7280;font-size:14px}.lab-i{fill:#1f2937;font-size:14px}.seg-w{fill:#ffffff;font-size:14px;font-weight:600}.seg-d{fill:#1f2937;font-size:14px;font-weight:600}.ax{fill:#6b7280;font-size:12px}</style>
  <rect width="1600" height="560" fill="#ffffff"/>
  <text x="40" y="58" class="t">How much of a coding-agent session is spent on the GPU</text>
  <text x="40" y="84" class="m">one Codex session on SWE-bench Pro, measured medians: a request takes about 5 s, the wait for the next tool result 5.2 s, with a long tail up to 81 s at the 99th percentile</text>
  <circle cx="1180" cy="60" r="7" fill="#0891b2"/><text x="1194" y="65" class="lab">request being processed</text>
  <line x1="1400" y1="60" x2="1430" y2="60" stroke="#d1d5db" stroke-width="6"/><text x="1438" y="65" class="lab">waiting for a tool result</text>

  <!-- timeline: 12 px per second, x0=300 -->
  <text x="40" y="160" class="b">One session</text>
  <text x="40" y="182" class="lab">first 60 seconds, to scale</text>
  <line x1="300" y1="156" x2="1020" y2="156" stroke="#d1d5db" stroke-width="6" stroke-linecap="round"/>
  <!-- cycles: call 5s (60px), wait 5.2s (62px) -->
  <rect x="300" y="146" width="60" height="20" rx="3" fill="#0891b2"/>
  <rect x="422" y="146" width="60" height="20" rx="3" fill="#0891b2"/>
  <rect x="544" y="146" width="60" height="20" rx="3" fill="#0891b2"/>
  <rect x="666" y="146" width="60" height="20" rx="3" fill="#0891b2"/>
  <rect x="788" y="146" width="60" height="20" rx="3" fill="#0891b2"/>
  <rect x="910" y="146" width="60" height="20" rx="3" fill="#0891b2"/>
  <!-- long wait, broken -->
  <line x1="1020" y1="156" x2="1090" y2="156" stroke="#d1d5db" stroke-width="6"/>
  <path d="M1090,146 L1098,166 L1106,146 L1114,166" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M1088,146 L1096,166 L1104,146 L1112,166" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <line x1="1114" y1="156" x2="1180" y2="156" stroke="#d1d5db" stroke-width="6"/>
  <rect x="1180" y="146" width="60" height="20" rx="3" fill="#0891b2"/>
  <!-- labels -->
  <text x="330" y="134" class="lab" text-anchor="middle">5 s</text>
  <text x="391" y="192" class="lab" text-anchor="middle">5.2 s</text>
  <text x="1135" y="134" class="lab" text-anchor="middle">one of the long waits: up to 81 s</text>
  <text x="300" y="214" class="ax">0 s</text><text x="660" y="214" class="ax" text-anchor="middle">30 s</text><text x="1020" y="214" class="ax" text-anchor="end">60 s</text>

  <!-- share bars -->
  <text x="40" y="290" class="b">Fraction of running time</text>
  <text x="40" y="310" class="b">on the GPU</text>

  <text x="300" y="268" class="lab-i">at the median wait: 5 s of request for every 5.2 s of waiting</text>
  <rect x="300" y="280" width="588" height="36" fill="#0891b2"/>
  <rect x="888" y="280" width="612" height="36" fill="#d1d5db"/>
  <text x="594" y="304" class="seg-w" text-anchor="middle">about half</text>
  <text x="1194" y="304" class="seg-d" text-anchor="middle">off the GPU, waiting for a tool</text>

  <text x="300" y="356" class="lab-i">once the long waits are counted: the average wait is roughly twice the median</text>
  <rect x="300" y="368" width="390" height="36" fill="#0891b2"/>
  <rect x="690" y="368" width="810" height="36" fill="#d1d5db"/>
  <text x="495" y="392" class="seg-w" text-anchor="middle">about a third</text>
  <text x="1095" y="392" class="seg-d" text-anchor="middle">off the GPU, waiting for a tool</text>

  <!-- conclusion -->
  <text x="300" y="460" class="b">100 of these sessions keep 30 to 50 requests on the GPU at any moment, not 100.</text>
  <text x="300" y="486" class="lab-i">The count rises when several tool results arrive at once and falls when a few sessions sit in a long wait.</text>
  <text x="300" y="508" class="lab">Request length from the per-turn latencies in the same trace. The average wait assumes a long-tailed distribution with the published median and 99th percentile.</text>
</svg>
