<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.t{fill:#1f2937;font-size:24px;font-weight:600}.m{fill:#6b7280;font-size:16px}.b{fill:#1f2937;font-size:16px;font-weight:600}
.lab{fill:#6b7280;font-size:14px}.lab-i{fill:#1f2937;font-size:14px}.k{fill:#ffffff;font-size:16px;font-weight:600}.kd{fill:#1f2937;font-size:16px;font-weight:600}
.mono{fill:#1f2937;font-size:16px;font-family:Menlo,Consolas,Liberation Mono,monospace}.ax{fill:#6b7280;font-size:12px}</style>
<rect width="1600" height="560" fill="#ffffff"/>
<text x="40" y="58" class="t">One hundred sessions: how many requests are on the GPU at once</text>
<text x="40" y="84" class="m">request time 5 s, from the Codex trace. Only the tool latency changes.</text>
<rect x="40" y="110" width="520" height="92" rx="4" fill="#f5f6f8"/>
<text x="56" y="140" class="lab-i">requests on the GPU at once =</text>
<text x="56" y="172" class="mono">sessions × request time / (request time + tool latency)</text>
<text x="56" y="194" class="lab">e.g. 100 × 5 / (5 + 5.2) = 49</text>
<line x1="1500" y1="230" x2="1500" y2="502" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1500" y="222" class="lab" text-anchor="end">100: what sizing by session count assumes</text>
<text x="40" y="222" class="b">tool latency</text>
<text x="40" y="278" class="kd">2.6 s</text>
<text x="120" y="278" class="lab">tool latency halved</text>
<rect x="560" y="250" width="620.4" height="44" rx="3" fill="#0891b2"/>
<rect x="1180.4" y="250" width="319.6" height="44" rx="3" fill="#d1d5db"/>
<text x="1168.4" y="278" class="k" text-anchor="end">66 requests on the GPU</text>
<text x="1192.4" y="278" class="lab-i">34 sessions waiting for a tool</text>
<text x="40" y="344" class="kd">5.2 s</text>
<text x="120" y="344" class="lab">measured median</text>
<rect x="560" y="316" width="460.6" height="44" rx="3" fill="#0891b2"/>
<rect x="1020.6" y="316" width="479.4" height="44" rx="3" fill="#d1d5db"/>
<text x="1008.6" y="344" class="k" text-anchor="end">49 requests on the GPU</text>
<text x="1032.6" y="344" class="lab-i">51 sessions waiting for a tool</text>
<text x="40" y="410" class="kd">10.4 s</text>
<text x="120" y="410" class="lab">measured tail included: average wait, about twice the median</text>
<rect x="560" y="382" width="310.2" height="44" rx="3" fill="#0891b2"/>
<rect x="870.2" y="382" width="629.8" height="44" rx="3" fill="#d1d5db"/>
<text x="858.2" y="410" class="k" text-anchor="end">33 requests on the GPU</text>
<text x="882.2" y="410" class="lab-i">67 sessions waiting for a tool</text>
<text x="40" y="476" class="kd">20.8 s</text>
<text x="120" y="476" class="lab">tool latency doubled from the average</text>
<rect x="560" y="448" width="178.6" height="44" rx="3" fill="#0891b2"/>
<rect x="738.6" y="448" width="761.4" height="44" rx="3" fill="#d1d5db"/>
<text x="738.6" y="476" class="lab-i" font-weight="600">19 requests on the GPU</text>
<text x="930" y="476" class="lab-i">81 sessions waiting for a tool</text>
<text x="40" y="534" class="lab-i">Halving the tool latency adds a third to the load; doubling it removes a third. Only when the wait is far longer than the request does halving it come close to doubling the load.</text>
</svg>