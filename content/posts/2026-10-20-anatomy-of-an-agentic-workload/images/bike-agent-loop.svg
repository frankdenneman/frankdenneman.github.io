<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t   { fill: #1f2937; font-size: 24px; font-weight: 600; }
    .m   { fill: #6b7280; font-size: 16px; }
    .b   { fill: #1f2937; font-size: 18px; }
    .b16 { fill: #1f2937; font-size: 16px; }
    .b20 { fill: #1f2937; font-size: 20px; font-weight: 600; }
    .task{ fill: #1f2937; font-size: 20px; }
    .lab { fill: #6b7280; font-size: 14px; }
    .mono{ fill: #1f2937; font-size: 15px; font-family: Menlo, Consolas, Liberation Mono, monospace; }
    .mono-m{ fill: #6b7280; font-size: 14px; font-family: Menlo, Consolas, Liberation Mono, monospace; }
    .ln  { stroke: #1f2937; stroke-width: 1.8; fill: none; }
  </style>
  <rect width="1600" height="640" fill="#ffffff"/>

  <text x="40" y="58" class="t">Agentic work</text>
  <text x="40" y="84" class="m">one request, three passes through the loop, each one decided by what the last one returned</text>

  <!-- ===== left: agent card ===== -->
  <rect x="40" y="120" width="520" height="490" rx="10" fill="#f5f6f8" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="140" width="480" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="80" y="180" class="task">Should I bike to Amsterdam tomorrow?</text>

  <circle cx="90" cy="240" r="9" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="40 16"/>
  <text x="112" y="247" class="b20">Working</text>
  <text x="212" y="247" class="m">0:14</text>
  <text x="290" y="247" class="m">6 actions</text>

  <path d="M92,275 V590" stroke="#d1d5db" stroke-width="2"/>
  <g>
    <circle cx="118" cy="305" r="9" fill="#0891b2"/><path d="M113.5,305 L117,308.5 L123,302.5" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="142" y="311" class="mono">get_calendar</text>
    <circle cx="118" cy="350" r="9" fill="#0891b2"/><path d="M113.5,350 L117,353.5 L123,347.5" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="142" y="356" class="mono">get_route</text>
    <circle cx="118" cy="395" r="9" fill="#0891b2"/><path d="M113.5,395 L117,398.5 L123,392.5" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="142" y="401" class="mono">get_weather  07:30</text>
    <circle cx="118" cy="445" r="9" fill="#fb923c"/><path d="M113.5,445 L117,448.5 L123,442.5" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="142" y="451" class="mono">headwind_on_route</text>
    <text x="142" y="471" class="lab">20 km at 35 km/h headwind on the 07:30 departure</text>
    <circle cx="118" cy="510" r="9" fill="#0891b2"/><path d="M113.5,510 L117,513.5 L123,507.5" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="142" y="516" class="mono">departure_options</text>
    <circle cx="118" cy="555" r="9" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="40 16"/>
    <text x="142" y="561" class="mono">get_weather  09:30</text>
    <text x="142" y="581" class="lab">does a later departure fit the calendar?</text>
  </g>

  <!-- ===== right: three passes ===== -->
  <circle cx="1220" cy="60" r="8" fill="#0891b2"/><text x="1236" y="65" class="lab">model call (GPU)</text>
  <circle cx="1380" cy="60" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/><text x="1396" y="65" class="lab">tool call, no GPU</text>

  <path d="M680,350 H760" class="ln"/>
  <path d="M760,350 C800,350 805,260 845,260 H915 C955,260 960,350 1000,350" class="ln"/>
  <path d="M1000,350 C1040,350 1045,260 1085,260 H1155 C1195,260 1200,350 1240,350" class="ln"/>
  <path d="M1240,350 C1280,350 1285,260 1325,260 H1395 C1435,260 1440,350 1480,350" class="ln"/>
  <path d="M1480,350 H1560" class="ln"/>

  <circle cx="680" cy="350" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="760" cy="350" r="11" fill="#0891b2"/>
  <circle cx="850" cy="260" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="910" cy="260" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="1000" cy="350" r="11" fill="#0891b2"/>
  <circle cx="1090" cy="260" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="1150" cy="260" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="1240" cy="350" r="11" fill="#0891b2"/>
  <circle cx="1330" cy="260" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="1390" cy="260" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <circle cx="1480" cy="350" r="11" fill="#0891b2"/>
  <circle cx="1560" cy="350" r="9" fill="#1f2937"/>

  <text x="880" y="160" class="b" text-anchor="middle">Pass 1: read state</text>
  <text x="850" y="206" class="mono-m" text-anchor="middle">get_calendar</text>
  <text x="910" y="232" class="mono-m" text-anchor="middle">get_route</text>
  <text x="1120" y="160" class="b" text-anchor="middle">Pass 2: the forecast that matters</text>
  <text x="1090" y="206" class="mono-m" text-anchor="middle">get_weather 07:30</text>
  <text x="1150" y="232" class="mono-m" text-anchor="middle">headwind_on_route</text>
  <text x="1360" y="160" class="b" text-anchor="middle">Pass 3: a later departure?</text>
  <text x="1330" y="206" class="mono-m" text-anchor="middle">departure_options</text>
  <text x="1390" y="232" class="mono-m" text-anchor="middle">get_weather 09:30</text>

  <text x="680" y="318" class="b" text-anchor="middle">One request</text>
  <text x="760" y="388" class="b16" text-anchor="middle">Plan</text>
  <text x="1000" y="388" class="b16" text-anchor="middle">Inspect,</text>
  <text x="1000" y="408" class="b16" text-anchor="middle">plan again</text>
  <text x="1240" y="388" class="b16" text-anchor="middle">Inspect,</text>
  <text x="1240" y="408" class="b16" text-anchor="middle">plan again</text>
  <text x="1480" y="388" class="b16" text-anchor="middle">Inspect,</text>
  <text x="1480" y="408" class="b16" text-anchor="middle">recommend</text>
  <text x="1585" y="318" class="b" text-anchor="end">Recommend</text>

  <text x="1000" y="442" class="lab" text-anchor="middle">09:00 meeting, 20 km route:</text>
  <text x="1000" y="460" class="lab" text-anchor="middle">leave 07:30, so check that forecast</text>
  <text x="1240" y="442" class="lab" text-anchor="middle">35 km/h headwind at 07:30:</text>
  <text x="1240" y="460" class="lab" text-anchor="middle">look for a later departure</text>
  <text x="1585" y="442" class="lab" text-anchor="end">later is worse; 06:45 is calm and fits:</text>
  <text x="1585" y="460" class="lab" text-anchor="end">leave at 06:45, or take the train</text>

  <text x="1120" y="540" class="lab" text-anchor="middle">4 model calls, 6 tool calls</text>
</svg>
