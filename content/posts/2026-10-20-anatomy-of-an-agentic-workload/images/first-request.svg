<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.t{fill:#1f2937;font-size:24px;font-weight:600}.m{fill:#6b7280;font-size:16px}.b{fill:#1f2937;font-size:16px;font-weight:600}
  .lab{fill:#6b7280;font-size:14px}.lab-i{fill:#1f2937;font-size:14px}.seg-w{fill:#ffffff;font-size:14px;font-weight:600}.k{fill:#1f2937;font-size:15px;font-weight:600}</style>
  <defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.6"/></pattern></defs>
  <rect width="1600" height="420" fill="#ffffff"/>
  <text x="40" y="58" class="t">What the first request contains, before the task</text>
  <text x="40" y="84" class="m">Claude Code in an empty directory, one configuration, one machine. Total and prompt share are measured; the split of the tool definitions is estimated from the published character counts.</text>

  <!-- bar: 23,207 tokens over 1200 px -->
  <text x="40" y="200" class="b">First request</text>
  <text x="40" y="222" class="lab">23,207 input tokens</text>
  <!-- prompt 2,664 -> 137.8px -->
  <rect x="300" y="170" width="138" height="56" fill="#1d4ed8"/><rect x="300" y="170" width="138" height="56" fill="url(#hatch)"/>
  <!-- built-in tool definitions ~8,300 -> 429px -->
  <rect x="438" y="170" width="429" height="56" fill="#0f766e"/>
  <text x="652" y="203" class="seg-w" text-anchor="middle">11 built-in tool definitions</text>
  <!-- skill tool listing ~5,700 -> 295px -->
  <rect x="867" y="170" width="295" height="56" fill="#60a5fa"/><rect x="867" y="170" width="295" height="56" fill="url(#hatch)"/>
  <text x="1014" y="203" class="seg-w" text-anchor="middle">listing of 48 skills</text>
  <!-- mcp tool definitions ~6,500 -> 338px -->
  <rect x="1162" y="170" width="338" height="56" fill="#14b8a6"/>
  <text x="1331" y="203" class="seg-w" text-anchor="middle">MCP server tool definitions</text>

  <!-- leaders and numbers -->
  <line x1="369" y1="168" x2="369" y2="140" stroke="#1f2937" stroke-width="1"/>
  <text x="369" y="132" class="k" text-anchor="middle">system prompt + environment: 2,664</text>
  <text x="652" y="252" class="lab" text-anchor="middle">≈ 8,300 (27,291 characters)</text>
  <text x="1014" y="252" class="lab" text-anchor="middle">≈ 5,700 (18,962 characters)</text>
  <text x="1331" y="252" class="lab" text-anchor="middle">≈ 6,500 (the remainder)</text>

  <!-- brace: tool definitions -->
  <path d="M438,268 V280 H1500 V268" stroke="#1f2937" stroke-width="1.2" fill="none"/>
  <text x="969" y="300" class="lab-i" text-anchor="middle">about 20,500 tokens of tool definitions: name, description and argument schema for every tool the model may call, sent on every request</text>

  <!-- the task, for scale -->
  <text x="40" y="360" class="b">The task</text>
  <text x="40" y="382" class="lab">"Can I drain gpu-node-07 now?"</text>
  <rect x="300" y="346" width="2" height="24" fill="#a78bfa"/>
  <text x="312" y="363" class="lab-i">about 12 tokens, at the same scale</text>

  <text x="1500" y="382" class="lab" text-anchor="end">Measurement: Rulestack, Claude Code 2.1.285, 2026-10-03</text>
</svg>
